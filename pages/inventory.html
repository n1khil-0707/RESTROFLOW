<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INVENTORY — RestoFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script defer src="../data/demo-data.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/calc.js"></script>
  <script defer src="../js/ui.js"></script>
  <script defer src="../js/navigation.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/inventory.js"></script>
</head>
<body data-page="inventory" data-root="../">
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <p class="eyebrow">Restaurant finance</p>
    <div class="page-head">
      <div class="title-card">
        <h1 class="display">Inventory</h1>
        <p>Track your stock levels.</p>
      </div>
      <button id="add-btn" class="btn btn-dark btn-xl" type="button">+ Add item</button>
    </div>

    <div class="toolbar">
      <label class="visually-hidden" for="search">Search inventory</label>
      <input id="search" class="input" type="search" placeholder="Search item, category or supplier…">
      <div class="tabs" role="group" aria-label="Filter by stock status">
        <button class="tab" type="button" data-tab="all" aria-pressed="true">All</button>
        <button class="tab" type="button" data-tab="in" aria-pressed="false">In stock</button>
        <button class="tab" type="button" data-tab="low" aria-pressed="false">Low stock</button>
        <button class="tab" type="button" data-tab="out" aria-pressed="false">Out of stock</button>
      </div>
    </div>

    <section class="data-card data-card--tall" aria-label="Inventory items">
      <table class="data-table data-table--inventory">
        <thead>
          <tr>
            <th scope="col">Item</th><th scope="col">Category</th>
            <th scope="col" class="cell-center">Quantity</th><th scope="col" class="cell-center">Stock value</th>
            <th scope="col" class="cell-center">Status</th><th scope="col" class="cell-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-body"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
