<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPORTS — RestoFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script defer src="../data/demo-data.js"></script>
  <script defer src="../js/api.js"></script>
  <script defer src="../js/calc.js"></script>
  <script defer src="../js/ui.js"></script>
  <script defer src="../js/navigation.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/forms.js"></script>
  <script defer src="../js/reports.js"></script>
</head>
<body data-page="reports" data-root="../">
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <p class="eyebrow">Restaurant finance</p>
    <div class="page-head">
      <div class="title-card"><h1 class="display">Reports</h1></div>
      <button id="quick-add" class="btn btn-dark btn-xl" type="button">+ Quick add</button>
    </div>

    <div class="report-grid">
      <h2 class="display report-heading">Profit &amp; Loss</h2>
      <section class="data-card pl-card" aria-label="Profit and loss">
        <dl id="pl-list" class="pl-list"></dl>
      </section>

      <section class="data-card export-card" aria-label="Export">
        <h2 class="display">Export</h2>
        <p>Download your current sales, expenses and menu data as CSV files.</p>
        <div class="export-actions">
          <button id="export-sales" class="btn btn-dark" type="button">Export sales CSV</button>
          <button id="export-expenses" class="btn btn-dark" type="button">Export expenses CSV</button>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
